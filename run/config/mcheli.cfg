;Client-only visual chase camera for third-person new-flight planes. Does not change flight physics, weapons, or HUD rendering.
EnableNewPlaneThirdPersonCamera = false
;Base chase distance in blocks for new-flight third-person planes. default is 15; 16 is often too close and 45-80+ can be reasonable by scale/speed.
PlaneChaseBaseDistance = 15.00
;Minimum chase distance in blocks after size and optional speed tuning; default 13 keeps aircraft framed when slowing down.
PlaneChaseMinDistance = 13.00
;Maximum chase distance in blocks after size and optional speed tuning; default 21 avoids aggressive zoom breathing.
PlaneChaseMaxDistance = 21.00
;DebugFlightControl-only chase camera distance override. Set 40 to verify the render path consumes the custom camera; 0 disables.
NewPlaneCameraDebugDistance = 0.00
;DebugFlightControl-only hard test: places the chase dummy at plane.posY + 20 with third-person distance zeroed.
NewPlaneCameraDebugAbovePlane = false
;Blocks above the aircraft for the new third-person plane chase camera.
NewPlaneCameraHeight = 4.00
;Optional horizontal side offset for the new third-person plane chase camera.
NewPlaneCameraSideOffset = 0.00
;Extra chase distance per block/tick of aircraft speed when speed-based distance is explicitly enabled; kept low to avoid zoom breathing.
PlaneChaseSpeedDistanceScale = 2.00
;Maximum extra blocks optional speed-based distance may add; default small for stable framing.
PlaneChaseSpeedDistanceMaxBonus = 3.00
;Overrides FOV only for the new-flight third-person plane chase camera; does not affect first person, legacy aircraft cameras, or normal Minecraft third person.
EnablePlaneChaseFOVOverride = false
;Target new plane chase camera FOV. Recommended range is 85-105; wider FOV improves awareness without excessive camera distance.
PlaneChaseFOV = 95.00
;Optional FOV while hold-freelook orbit is active; defaults to match PlaneChaseFOV.
PlaneChaseFreelookFOV = 95.00
;How quickly the chase FOV override blends in, changes for freelook, and restores when leaving chase camera.
PlaneChaseFOVSmoothing = 0.25
;Extra chase distance per block of aircraft bounding-box size; helps bombers and large planes frame comfortably.
NewPlaneCameraSizeDistanceScale = 1.25
;Raises the new chase camera focus above the aircraft so the model sits lower on screen.
PlaneChaseFocusVerticalOffset = 2.50
;Additional aim/framing height above the focus so the crosshair favors forward airspace over the plane model.
PlaneChaseScreenVerticalBias = 4.00
;Held Plane Look Ahead focus distance in blocks along aircraft facing. Does not alter aircraft controls.
PlaneLookAheadDistance = 12.00
;How quickly held Plane Look Ahead blends into its forward focus.
PlaneLookAheadSmoothing = 0.35
;How quickly Plane Look Ahead returns to standard centered chase framing after release.
PlaneLookAheadReturnSmoothing = 0.25
;How quickly hold-freelook returns to normal chase-camera orientation after release.
FreelookReturnSmoothing = 0.28
;Mouse sensitivity multiplier for new chase-camera hold freelook target orbit yaw/pitch.
PlaneFreelookOrbitSensitivity = 0.15
PlaneFreelookYawSmoothing = 0.20
PlaneFreelookPitchSmoothing = 0.20
PlaneFreelookReturnSmoothing = 0.14
PlaneFreelookMaxPitchUp = 75.00
PlaneFreelookMaxPitchDown = 65.00
;How quickly camera position follows the desired point. Higher is snappier.
NewPlaneCameraPositionSmoothing = 0.22
;How quickly normal chase camera yaw follows the raised aim focus.
NewPlaneCameraYawSmoothing = 0.26
;How quickly chase camera pitch follows climbs/dives.
NewPlaneCameraPitchSmoothing = 0.22
;How quickly speed/size/collision distance changes are applied.
NewPlaneCameraDistanceSmoothing = 0.16
;How quickly the chase focus moves when held look-ahead or framing offsets change.
NewPlaneCameraFocusSmoothing = 0.24
;Smoothing for plane pitch influence so steep climbs/dives read without snapping.
NewPlaneCameraPitchInfluenceSmoothing = 0.30
;How much aircraft pitch affects the new chase camera direction; conservative defaults keep the camera observational instead of glued to the plane.
PlaneChasePitchInfluence = 0.25
;0.0 keeps the horizon stable; 1.0 fully rolls the chase camera with the aircraft. Conservative defaults avoid nausea.
NewPlaneCameraRollInfluence = 0.12
;Keeps the new chase camera horizon more stable than the aircraft by applying conservative roll and pitch inheritance.
PlaneChaseHorizonStabilization = true
;Disabled by default so the new plane chase camera stays near its stable base distance instead of breathing with throttle/speed.
EnableSpeedBasedCameraDistance = false
EnableNewPlaneCameraCollision = false
EnablePlaneLookAhead = false
;When enabled, the Free Look key must be held; when disabled, Free Look toggles on/off with each key press.
