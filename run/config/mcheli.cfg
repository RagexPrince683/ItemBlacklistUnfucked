EnableNewPlaneCameraRollInfluence = false
;Deprecated alias for EnableNewPlaneCameraCollision; moves the chase camera in front of solid blocks when line-of-sight collision is detected.
NewPlaneCameraCollision = false
DisableThirdPersonCameraDistChange = false
